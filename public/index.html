<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crewaudio</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <aside id="library">
    <header>
      <h1>crewaudio</h1>
      <button id="refresh" title="Rescan audio folder">↻</button>
    </header>

    <div id="import">
      <input id="yt-url" type="url" placeholder="YouTube playlist or video URL">
      <input id="yt-name" type="text" placeholder="Folder name (optional)">
      <button id="yt-go">Import audio</button>
      <pre id="yt-log" hidden></pre>
    </div>

    <div id="groups"></div>
    <p id="empty" hidden>No audio yet. Import a playlist above or drop files into <code>audio/</code>.</p>
  </aside>

  <main id="player-pane">
    <div id="now-playing">
      <div id="np-book"></div>
      <div id="np-title">Select a track</div>
      <audio id="audio" controls preload="metadata"></audio>
      <div id="transport">
        <button id="prev" title="Previous">⏮</button>
        <button id="next" title="Next">⏭</button>
        <label><input type="checkbox" id="autoplay" checked> Auto-advance</label>
        <span id="resume-note"></span>
      </div>
    </div>

    <section id="chapter-section">
      <div class="chapter-head">
        <h2>Chapters</h2>
        <div class="chapter-controls">
          <label>Silence <input id="p-noise" type="number" value="-30" step="1"> dB</label>
          <label>min <input id="p-min" type="number" value="0.5" step="0.1" min="0.1"> s</label>
          <label>gap <input id="p-gap" type="number" value="1.5" step="0.1" min="0.1"> s</label>
          <button id="detect">Detect</button>
          <button id="redetect" title="Ignore cache">force</button>
        </div>
      </div>
      <div id="chapter-status"></div>
      <ol id="chapter-list"></ol>
    </section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
